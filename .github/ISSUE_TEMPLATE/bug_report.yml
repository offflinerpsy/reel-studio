name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and remove private information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Reel Studio version, host and version, operating system, and Node version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant sanitized logs or screenshots
      description: Do not include credentials, personal media, or account details. Report vulnerabilities privately as described in SECURITY.md.
