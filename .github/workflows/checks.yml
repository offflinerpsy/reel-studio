name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm run setup
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Full Studio and BB suites
        run: |
          npm test --prefix packages/studio
          npm test --prefix packages/bb
      - name: Scan public inputs
        run: npm run scan -- --staged
      - name: Package and scan release
        run: npm run package
      - name: Smoke packaged Studio and BB catalog
        run: npm run smoke:package
